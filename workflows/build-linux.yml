# 手動觸發，建置結果保存為附件；版本發佈由維護者另行操作。
name: 手動 Linux 建置

# 在 GitHub 託管的 ubuntu-22.04 runner 上編譯 Linux 桌面端安裝包（deb + AppImage）。
on:
  workflow_dispatch: null

env:
  CI: "true"

jobs:
  linux:
    name: Linux (deb + appimage)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: 安裝系統依賴 (Tauri 2 / WebKit2GTK-4.1)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev librsvg2-dev \
            build-essential pkg-config libssl-dev patchelf \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly gstreamer1.0-libav

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: 安裝依賴
        run: pnpm install --frozen-lockfile

      - name: 構建 (deb + appimage)
        run: pnpm tauri build --bundles deb appimage

      - name: 收集產物
        run: |
          mkdir -p artifacts
          cp src-tauri/target/release/bundle/deb/*.deb artifacts/ 2>/dev/null || true
          cp src-tauri/target/release/bundle/appimage/*.AppImage artifacts/ 2>/dev/null || true
          ls -la artifacts

      - name: 上傳產物
        uses: actions/upload-artifact@v4
        with:
          name: HGhub-linux
          path: artifacts/*
permissions:
  contents: read
